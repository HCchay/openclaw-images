<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#141418" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* 整个小人跑步起伏（父级运动） */
    .runner-body {
      animation: runBob 0.6s ease-in-out infinite alternate;
      transform-origin: 220px 180px;
    }
    @keyframes runBob {
      0% { transform: translateY(0px) rotate(-1deg); }
      100% { transform: translateY(-12px) rotate(2deg); }
    }

    /* 头发主摆动（子级相对运动，在头部局部坐标系随动） */
    .hair-tail-1 {
      animation: hairWave1 0.6s ease-in-out infinite alternate;
      transform-origin: 195px 105px;
    }
    @keyframes hairWave1 {
      0% { transform: rotate(-8deg) scaleY(0.9); }
      50% { transform: rotate(12deg) scaleY(1.1); }
      100% { transform: rotate(-18deg) scaleY(0.85); }
    }

    .hair-tail-2 {
      animation: hairWave2 0.6s ease-in-out infinite alternate;
      transform-origin: 195px 112px;
      animation-delay: 0.1s;
    }
    @keyframes hairWave2 {
      0% { transform: rotate(-14deg) scaleY(0.95); }
      50% { transform: rotate(8deg) scaleY(1.05); }
      100% { transform: rotate(-22deg) scaleY(0.8); }
    }

    .hair-strand {
      animation: hairWave3 0.6s ease-in-out infinite alternate;
      transform-origin: 190px 118px;
      animation-delay: 0.18s;
    }
    @keyframes hairWave3 {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(-25deg); }
    }

    /* 前后腿迈步 */
    .leg-front {
      animation: legCycleFront 0.6s ease-in-out infinite alternate;
      transform-origin: 225px 170px;
    }
    @keyframes legCycleFront {
      0% { transform: rotate(35deg); }
      100% { transform: rotate(-40deg); }
    }

    .leg-back {
      animation: legCycleBack 0.6s ease-in-out infinite alternate;
      transform-origin: 215px 170px;
    }
    @keyframes legCycleBack {
      0% { transform: rotate(-35deg); }
      100% { transform: rotate(35deg); }
    }

    /* 双手前后摆臂 */
    .arm-front {
      animation: armFront 0.6s ease-in-out infinite alternate;
      transform-origin: 225px 130px;
    }
    @keyframes armFront {
      0% { transform: rotate(-35deg); }
      100% { transform: rotate(40deg); }
    }

    .arm-back {
      animation: armBack 0.6s ease-in-out infinite alternate;
      transform-origin: 215px 130px;
    }
    @keyframes armBack {
      0% { transform: rotate(35deg); }
      100% { transform: rotate(-35deg); }
    }

    /* 地面与速度线流动 */
    .speed-line-1 {
      animation: speedMove 0.8s linear infinite;
    }
    .speed-line-2 {
      animation: speedMove 0.6s linear infinite;
      animation-delay: 0.2s;
    }
    .speed-line-3 {
      animation: speedMove 0.7s linear infinite;
      animation-delay: 0.4s;
    }
    @keyframes speedMove {
      0% { transform: translateX(120px); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translateX(-160px); opacity: 0; }
    }

    /* 呼吸发光指示线 */
    .tag-pulse {
      animation: tagPulse 1.8s ease-in-out infinite alternate;
    }
    @keyframes tagPulse {
      0% { opacity: 0.85; }
      100% { opacity: 1; filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6)); }
    }
  </style>

  <!-- 卡片背景 -->
  <rect width="800" height="280" rx="16" fill="url(#bgGrad)" stroke="#2e2e38" stroke-width="1.5" />

  <!-- 速度风线 -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.15">
    <line class="speed-line-1" x1="380" y1="90" x2="480" y2="90" />
    <line class="speed-line-2" x1="340" y1="130" x2="430" y2="130" />
    <line class="speed-line-3" x1="360" y1="170" x2="470" y2="170" />
  </g>

  <!-- 奔跑地面 -->
  <line x1="40" y1="230" x2="450" y2="230" stroke="#374151" stroke-width="2" stroke-dasharray="6 6" />

  <!-- ==================== 奔跑的小人 (主体) ==================== -->
  <g class="runner-body">

    <!-- 头发 (子级 Contents) - 挂在头部后侧，随动晃动 -->
    <g id="hair-group" class="tag-pulse">
      <!-- 长马尾发束 1 (上层波浪) -->
      <path class="hair-tail-1" d="M 195 105 C 160 100 120 70 65 75 C 105 95 145 120 195 115 Z" fill="url(#hairGrad)" filter="url(#glow)" />
      <!-- 长马尾发束 2 (中层主束) -->
      <path class="hair-tail-2" d="M 195 110 C 150 115 110 95 50 105 C 95 125 140 140 195 122 Z" fill="#f59e0b" />
      <!-- 细碎发丝 (下层飘动) -->
      <path class="hair-strand" d="M 190 118 C 160 128 130 125 80 140 C 120 145 160 140 190 125 Z" fill="#d97706" opacity="0.9" />
    </g>

    <!-- 后腿 -->
    <line class="leg-back" x1="218" y1="168" x2="190" y2="225" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />

    <!-- 后手臂 -->
    <line class="arm-back" x1="218" y1="132" x2="195" y2="155" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" />

    <!-- 躯干 (身躯) -->
    <path d="M 210 118 L 226 118 L 222 170 L 208 170 Z" fill="url(#bodyGrad)" rx="4" />

    <!-- 前腿 -->
    <line class="leg-front" x1="222" y1="168" x2="250" y2="225" stroke="#60a5fa" stroke-width="7" stroke-linecap="round" />

    <!-- 头部 (与身体连为一体) -->
    <circle cx="220" cy="105" r="18" fill="#fbcfe8" />
    <!-- 头部发型底座 -->
    <path d="M 205 105 C 205 92 215 88 228 88 C 238 88 240 98 238 105 C 230 100 215 100 205 105 Z" fill="#d97706" />

    <!-- 前手臂 -->
    <line class="arm-front" x1="224" y1="132" x2="252" y2="150" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" />

    <!-- 身体父级外轮廓指示框 (虚线框示 Panel) -->
    <rect x="175" y="80" width="85" height="152" rx="10" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />
  </g>

  <!-- ==================== 架构与逻辑指示标注 ==================== -->

  <!-- 头发指示 (子级) -->
  <g transform="translate(60, 35)">
    <rect x="0" y="0" width="200" height="28" rx="14" fill="#78350f" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.2" />
    <text x="100" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#fef3c7" text-anchor="middle">
      ✨ 头发 (子级 Contents)
    </text>
    <!-- 指示箭头 -->
    <path d="M 100 28 L 100 55 L 115 65" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="115" cy="65" r="2.5" fill="#f59e0b" />
  </g>

  <!-- 身体指示 (父级) -->
  <g transform="translate(230, 25)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#312e81" fill-opacity="0.6" stroke="#818cf8" stroke-width="1.2" />
    <text x="90" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e0e7ff" text-anchor="middle">
      🏃 身体 (父级 Panel)
    </text>
    <!-- 指示箭头 -->
    <path d="M 90 28 L 90 55 L 45 78" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="45" cy="78" r="2.5" fill="#818cf8" />
  </g>

  <!-- 右侧说明与对比卡片 -->
  <g transform="translate(480, 30)">
    <!-- 推荐做法卡片 -->
    <rect x="0" y="0" width="280" height="100" rx="10" fill="#132a1f" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="24" r="6" fill="#10b981" />
    <text x="34" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#34d399">
      🟢 推荐做法（人跑头发飘）
    </text>
    <text x="20" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a7f3d0">
      • 身体（父级）：统管整体位移与进出节奏
    </text>
    <text x="20" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a7f3d0">
      • 头发（子级）：仅在相对坐标内做惯性随动
    </text>
    <text x="20" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6ee7b7" opacity="0.8">
      👉 步调统一，浑然一体，绝不撕裂脱节
    </text>

    <!-- 不推荐做法卡片 -->
    <rect x="0" y="112" width="280" height="98" rx="10" fill="#2d1518" stroke="#ef4444" stroke-width="1" />
    <circle cx="20" cy="136" r="6" fill="#ef4444" />
    <text x="34" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f87171">
      🔴 不太推荐的做法
    </text>
    <text x="20" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#fecaca">
      • 子级自己挂载全局位移与独立透明度
    </text>
    <text x="20" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#fecaca">
      • 关界面时内容先空了，底框还在移（穿帮）
    </text>
    <text x="20" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fca5a5" opacity="0.8">
      👉 就像“人跑了头发落在原地”，严重脱节
    </text>
  </g>
</svg>