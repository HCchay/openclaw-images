<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="440">
  <defs>
    <!-- 背景与面板渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0f1115" />
    </linearGradient>
    <linearGradient id="trackGradCorrect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="trackGradWrong" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    /* ========================= 全局 3.6 秒循环节奏 =========================
       0% ~ 8% (0~0.3s): A 点准备
       8% ~ 42% (0.3~1.5s): 跑向 B 点 (位移 340px)
       42% ~ 88% (1.5~3.2s): B 点展示 (滞留)
       88% ~ 100% (3.2~3.6s): 淡出重置回 A 点
    */

    /* ---------- 轨道 1：推荐做法（人发同步） ---------- */
    .runner-correct {
      animation: runCorrect 3.6s cubic-bezier(0.2, 0.8, 0.25, 1) infinite;
    }
    @keyframes runCorrect {
      0%, 8% { transform: translateX(0px); opacity: 1; }
      42%, 88% { transform: translateX(340px); opacity: 1; }
      93% { opacity: 0; transform: translateX(340px); }
      95% { opacity: 0; transform: translateX(0px); }
      100% { opacity: 1; transform: translateX(0px); }
    }

    /* 正确的奔跑上下颠簸 */
    .bob-correct {
      animation: bobMotion 0.3s ease-in-out infinite alternate;
    }

    /* 正确头发随动波浪 */
    .hair-wave-correct {
      animation: hairWaveMotion 0.3s ease-in-out infinite alternate;
      transform-origin: 18px 20px;
    }
    @keyframes hairWaveMotion {
      0% { transform: rotate(-5deg) scaleY(0.9); }
      100% { transform: rotate(18deg) scaleY(1.15); }
    }

    /* ---------- 轨道 2：脱节 Bug（人先跑，头发掉下后 0.2s 飞来） ---------- */
    /* 小人身体自己先跑 */
    .runner-wrong-body {
      animation: runWrongBody 3.6s cubic-bezier(0.2, 0.8, 0.25, 1) infinite;
    }
    @keyframes runWrongBody {
      0%, 8% { transform: translateX(0px); opacity: 1; }
      42%, 88% { transform: translateX(340px); opacity: 1; }
      93% { opacity: 0; transform: translateX(340px); }
      95% { opacity: 0; transform: translateX(0px); }
      100% { opacity: 1; transform: translateX(0px); }
    }

    /* 头发脱落滞后！在 A 点漂浮，等小人到 B 点(42%)后滞后到 48% (约0.2s后) 突然狂飞追赶！ */
    .hair-wrong-detached {
      animation: hairLagMotion 3.6s cubic-bezier(0.3, 0.0, 0.2, 1) infinite;
    }
    @keyframes hairLagMotion {
      0%, 8% { transform: translateX(0px) rotate(0deg); opacity: 1; }
      /* 人跑了，头发掉在原地漂浮晃动 */
      15% { transform: translateX(25px) translateY(-8px) rotate(15deg); }
      25% { transform: translateX(10px) translateY(5px) rotate(-10deg); }
      38% { transform: translateX(18px) translateY(-4px) rotate(8deg); }
      44% { transform: translateX(15px) translateY(0px) rotate(0deg); } /* 小人刚到 B 点，头发还在 A 点！ */
      /* 隔了 0.2 秒 (48% ~ 58%)，急匆匆嗖地狂飞冲向 B 点！ */
      58%, 88% { transform: translateX(340px) translateY(0px) rotate(0deg); opacity: 1; }
      93% { opacity: 0; transform: translateX(340px); }
      95% { opacity: 0; transform: translateX(0px); }
      100% { opacity: 1; transform: translateX(0px); }
    }

    /* 头发掉落时的尴尬抖动 */
    .hair-shiver {
      animation: shiver 0.2s ease-in-out infinite alternate;
      transform-origin: 18px 20px;
    }
    @keyframes shiver {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(12deg); }
    }

    /* 小人到了 B 点头秃的尴尬问号冒出 */
    .awkward-mark {
      animation: awkwardPop 3.6s ease-in-out infinite;
    }
    @keyframes awkwardPop {
      0%, 41% { opacity: 0; transform: translateY(0px) scale(0.5); }
      43% { opacity: 1; transform: translateY(-8px) scale(1.1); }
      48% { opacity: 1; transform: translateY(-10px) scale(1.0); }
      56%, 100% { opacity: 0; transform: translateY(-15px) scale(0.6); }
    }

    /* 迈步腿部动画 */
    .leg-cycle-1 {
      animation: legCycle1 0.3s ease-in-out infinite alternate;
      transform-origin: 20px 48px;
    }
    .leg-cycle-2 {
      animation: legCycle2 0.3s ease-in-out infinite alternate;
      transform-origin: 20px 48px;
    }
    @keyframes legCycle1 { 0% { transform: rotate(35deg); } 100% { transform: rotate(-35deg); } }
    @keyframes legCycle2 { 0% { transform: rotate(-35deg); } 100% { transform: rotate(35deg); } }

    /* 速度风线 */
    .wind-line {
      animation: wind 1s linear infinite;
    }
    @keyframes wind {
      0% { transform: translateX(100px); opacity: 0; }
      30% { opacity: 0.6; }
      70% { opacity: 0.6; }
      100% { transform: translateX(-150px); opacity: 0; }
    }
  </style>

  <!-- 大卡片背景 -->
  <rect width="840" height="440" rx="16" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5" />

  <!-- 顶部标题栏 -->
  <g transform="translate(30, 28)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#f4f4f5">
      🏃‍♂️ “人跑头发飘”法则：父子层级同步 vs 脱节对比演示
    </text>
    <text x="560" y="2" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#71717a">
      周期循环：3.6s · 60fps 缓动
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- 🟢 轨道 1：推荐做法（人跑头发一起跑 · 步调一致）                     -->
  <!-- ================================================================= -->
  <g transform="translate(30, 55)">
    <!-- 跑道底板 -->
    <rect width="780" height="165" rx="12" fill="url(#trackGradCorrect)" stroke="#059669" stroke-width="1.2" />

    <!-- 跑道标签 -->
    <rect x="16" y="14" width="220" height="26" rx="6" fill="#064e3b" />
    <text x="26" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#34d399">
      🟢 推荐做法：父子层级随动（人带发跑）
    </text>
    <text x="250" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a7f3d0">
      父级统管大位移，头发在相对坐标内自然漂拂，浑然一体
    </text>

    <!-- 跑道点位标尺：A 点与 B 点 -->
    <line x1="80" y1="135" x2="680" y2="135" stroke="#065f46" stroke-width="2" stroke-dasharray="6 6" />

    <!-- A 点标桩 -->
    <g transform="translate(80, 135)">
      <circle r="4" fill="#10b981" />
      <text y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle">A 点 (起跑)</text>
    </g>

    <!-- B 点标桩 -->
    <g transform="translate(420, 135)">
      <circle r="4" fill="#10b981" />
      <text y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle">B 点 (到达)</text>
    </g>

    <!-- 奔跑主体（整体包含身体与头发，整体平移从 A 到 B） -->
    <g class="runner-correct" transform="translate(60, 60)">
      <g class="bob-correct">
        <!-- 头发 (子级 Contents) - 绑在后脑勺，随身体一起位移并在局部晃动 -->
        <g class="hair-wave-correct" transform="translate(-16, 2)">
          <path d="M 20 18 C -10 12 -35 -5 -65 0 C -35 15 -10 32 20 28 Z" fill="url(#hairGrad)" filter="url(#shadow)" />
          <path d="M 18 22 C -8 24 -25 15 -50 24 C -25 36 -5 38 18 28 Z" fill="#f59e0b" opacity="0.9" />
          <circle cx="-62" cy="1" r="3" fill="#fde68a" />
        </g>

        <!-- 双腿迈步 -->
        <line class="leg-cycle-1" x1="20" y1="46" x2="8" y2="72" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" />
        <line class="leg-cycle-2" x1="20" y1="46" x2="35" y2="72" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" />

        <!-- 躯干身体 (父级 Panel) -->
        <path d="M 12 24 L 28 24 L 25 50 L 13 50 Z" fill="url(#bodyGrad)" rx="3" />

        <!-- 双臂前后摆动 -->
        <line class="leg-cycle-2" x1="16" y1="28" x2="3" y2="44" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
        <line class="leg-cycle-1" x1="22" y1="28" x2="38" y2="40" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />

        <!-- 头部 -->
        <circle cx="20" cy="16" r="13" fill="#fbcfe8" />
        <path d="M 10 16 C 10 7 18 4 28 5 C 33 12 30 18 28 19 C 20 14 14 16 10 16 Z" fill="#d97706" />

        <!-- 状态标注 -->
        <rect x="-35" y="-18" width="105" height="18" rx="9" fill="#047857" fill-opacity="0.8" />
        <text x="17" y="-5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#ecfdf5" text-anchor="middle">
          身体+头发 同步到达
        </text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- 🔴 轨道 2：常见脱节 Bug（人先跑光头到 B，头发掉在 A，0.2s 后飞来）    -->
  <!-- ================================================================= -->
  <g transform="translate(30, 240)">
    <!-- 跑道底板 -->
    <rect width="780" height="175" rx="12" fill="url(#trackGradWrong)" stroke="#b91c1c" stroke-width="1.2" />

    <!-- 跑道标签 -->
    <rect x="16" y="14" width="235" height="26" rx="6" fill="#7f1d1d" />
    <text x="26" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f87171">
      🔴 常见问题：父子脱节（头发被甩身后）
    </text>
    <text x="265" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fca5a5">
      人一跑头发掉在 A 点；人到 B 点 0.2 秒后，头发才突兀地飞过来扣头上！
    </text>

    <!-- 跑道点位标尺：A 点与 B 点 -->
    <line x1="80" y1="140" x2="680" y2="140" stroke="#7f1d1d" stroke-width="2" stroke-dasharray="6 6" />

    <!-- A 点标桩 -->
    <g transform="translate(80, 140)">
      <circle r="4" fill="#ef4444" />
      <text y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">A 点 (起跑脱落)</text>
    </g>

    <!-- B 点标桩 -->
    <g transform="translate(420, 140)">
      <circle r="4" fill="#ef4444" />
      <text y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">B 点 (光头等待)</text>
    </g>

    <!-- 1. 独立运行的头发（脱节动画：留在 A 点发抖，等 0.2s 后冲刺） -->
    <g class="hair-wrong-detached" transform="translate(60, 65)">
      <g class="hair-shiver" transform="translate(-16, 2)">
        <path d="M 20 18 C -10 12 -35 -5 -65 0 C -35 15 -10 32 20 28 Z" fill="url(#hairGrad)" filter="url(#shadow)" />
        <path d="M 18 22 C -8 24 -25 15 -50 24 C -25 36 -5 38 18 28 Z" fill="#f59e0b" opacity="0.9" />
        <!-- 假发掉落标牌 -->
        <rect x="-70" y="-18" width="85" height="16" rx="4" fill="#991b1b" fill-opacity="0.9" />
        <text x="-27" y="-6" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="bold" fill="#fef2f2" text-anchor="middle">
          头发掉在A点!
        </text>
      </g>
    </g>

    <!-- 2. 小人身体自己跑（父级独立位移，光着头跑到 B 点） -->
    <g class="runner-wrong-body" transform="translate(60, 65)">
      <g class="bob-correct">
        <!-- 双腿迈步 -->
        <line class="leg-cycle-1" x1="20" y1="46" x2="8" y2="72" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
        <line class="leg-cycle-2" x1="20" y1="46" x2="35" y2="72" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />

        <!-- 躯干身体 -->
        <path d="M 12 24 L 28 24 L 25 50 L 13 50 Z" fill="#475569" rx="3" />

        <!-- 双臂前后摆动 -->
        <line class="leg-cycle-2" x1="16" y1="28" x2="3" y2="44" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
        <line class="leg-cycle-1" x1="22" y1="28" x2="38" y2="40" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

        <!-- 秃头头部（光溜溜到达 B 点） -->
        <circle cx="20" cy="16" r="13" fill="#fbcfe8" />
        <!-- 只有后脑勺一点点光头轮廓，没有头发！ -->
        <circle cx="16" cy="10" r="2" fill="#f43f5e" opacity="0.4" />

        <!-- 尴尬问号：小人到了 B 点，发现头发还没来，冒出问号 -->
        <g class="awkward-mark" transform="translate(16, -6)">
          <circle cx="4" cy="-4" r="9" fill="#dc2626" />
          <text x="4" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">?</text>
          <text x="35" y="-1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#fca5a5">
            头发呢?! (等0.2s)
          </text>
        </g>
      </g>
    </g>

  </g>
</svg>